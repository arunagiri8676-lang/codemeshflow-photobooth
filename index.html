<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a0a">
<title>CodeMeshFlow PhotoBooth</title>
<meta name="description" content="Free online photobooth by CodeMeshFlow. Take photo strips, save to your gallery or PDF.">
<style>
:root{--bg:#0b0a0a;--panel:#161313;--line:#2a2222;--red:#ef4444;--red2:#b91c1c;--txt:#f4efee;--mut:#9a8f8e;--r:14px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;min-height:100vh}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.1;letter-spacing:-.02em}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{width:min(1100px,100% - 32px);margin-inline:auto}
section{padding:56px 0;scroll-margin-top:64px}
nav{position:sticky;top:0;z-index:30;background:rgba(11,10,10,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:56px;gap:12px}
.brand{font-family:Georgia,serif;font-weight:700;font-size:18px;text-decoration:none;display:flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red)}
nav ul{display:flex;gap:18px;list-style:none;padding:0;font-size:14px}
nav ul a{text-decoration:none;color:var(--mut)}nav ul a:hover{color:var(--txt)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-decoration:none;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--red)}
.btn.pri{background:linear-gradient(135deg,var(--red),var(--red2));border-color:transparent;color:#fff}
.btn[disabled]{opacity:.5;pointer-events:none}
#hero{padding:72px 0 40px}
#hero h1{font-size:clamp(40px,8vw,84px);max-width:11ch}
#hero p{color:var(--mut);max-width:48ch;margin:18px 0 26px;font-size:18px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.booth{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:start}
.cam{position:relative;aspect-ratio:4/3;background:#000;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.cam video,.cam canvas.demo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mirror{transform:scaleX(-1)}
#cd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);font:800 120px Georgia,serif;color:var(--red)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:fl .5s ease-out}@keyframes fl{0%{opacity:.95}100%{opacity:0}}
#stk{position:absolute;inset:0;pointer-events:none}
#stk span{position:absolute;font-size:34px;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer}
.status{position:absolute;top:10px;left:10px;font-size:12px;background:rgba(0,0,0,.65);padding:5px 10px;border-radius:99px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:16px}
.panel label{font-size:13px;color:var(--mut);display:block;margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px}
.seg button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:#100d0d;cursor:pointer;font-size:14px}
.seg button.on{border-color:var(--red);background:#2a0f0f;color:#ffb4b4}
input[type=text],input[type=url],textarea,select{width:100%;min-height:44px;padding:10px 12px;background:#100d0d;border:1px solid var(--line);border-radius:10px}
.colors button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.colors button.on{border-color:var(--red);box-shadow:0 0 0 3px #3a1212}
.shutter{width:100%;min-height:56px;font-size:16px}
.cnt{font-size:13px;color:var(--mut);margin-top:10px;text-align:center}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
.card img{width:100%;border-radius:8px;display:block}
.card .row{margin-top:8px;gap:6px}.card .btn{min-height:38px;padding:0 10px;font-size:12px;flex:1}
.empty{color:var(--mut);padding:30px;border:1px dashed var(--line);border-radius:12px;text-align:center}
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px}
#modal.open{display:block}
.sheet{max-width:560px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:14px}
.sheet img{width:100%;max-height:60vh;object-fit:contain;border-radius:8px;background:#000}
footer{border-top:1px solid var(--line);padding:28px 0 calc(28px + env(safe-area-inset-bottom));color:var(--mut);font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:#201414;border:1px solid var(--red);padding:12px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:80;font-size:14px;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){.booth{grid-template-columns:1fr}nav ul{display:none}section{padding:40px 0}#cd{font-size:90px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}
</style>
</head>
<body>

<nav><div class="wrap">
  <a class="brand" href="#top"><span class="dot"></span><span data-c="brand">CodeMeshFlow PhotoBooth</span></a>
  <ul><li><a href="#booth">Booth</a></li><li><a href="#gallery">Gallery</a></li></ul>
  <a class="btn pri" href="#booth">Start</a>
</div></nav>

<header id="top"><div class="wrap" id="hero">
  <h1 data-c="headline">Pick 1 to 4 frames.</h1>
  <p data-c="tagline">Pose, then save your photos to your gallery or as a PDF.</p>
  <div class="row"><a class="btn pri" href="#booth">Open the booth</a><a class="btn" href="#gallery">View gallery</a></div>
</div></header>

<section id="booth"><div class="wrap">
  <div class="booth">
    <div>
      <div class="cam" id="cam">
        <video id="vid" autoplay playsinline muted></video>
        <canvas class="demo" id="demo" width="800" height="600" hidden></canvas>
        <div id="stk"></div><div id="cd">3</div><div id="flash"></div>
        <div class="status" id="status">Starting camera…</div>
      </div>
      <p class="cnt" id="count">Shot 0 of 3</p>
    </div>
    <div class="panel">
      <div><label>Layout</label><div class="seg" id="s-layout"><button data-v="1">1 photo</button><button data-v="2">2 photos</button><button class="on" data-v="3">3 photos</button><button data-v="4">4 photos</button></div></div>
      <div><label>Countdown</label><div class="seg" id="s-time"><button data-v="2">2s</button><button class="on" data-v="3">3s</button><button data-v="5">5s</button><button data-v="10">10s</button></div></div>
      <div><label for="filter">Filter</label><select id="filter"><option value="none">Normal</option><option value="warm">Warm red</option><option value="green">Green neon</option><option value="gray">Noir</option><option value="sepia">Vintage sepia</option></select></div>
      <div><label>Stickers (tap one on the camera to remove)</label><div class="seg" id="s-stk"><button>🔥</button><button>⚡</button><button>💎</button><button>⭐</button><button>🚀</button><button data-clear>Clear</button></div></div>
      <div><label>Frame colour</label><div class="row colors" id="s-col"><button class="on" style="background:#000" data-v="#000000" aria-label="Black"></button><button style="background:#2a0707" data-v="#2a0707" aria-label="Crimson"></button><button style="background:#2b2b2b" data-v="#2b2b2b" aria-label="Graphite"></button><button style="background:#fff" data-v="#ffffff" aria-label="White"></button></div></div>
      <div class="row"><button class="btn" id="flip">Flip camera</button><button class="btn" id="demoBtn">Demo feed</button></div>
      <button class="btn pri shutter" id="shoot">Take photos</button>
    </div>
  </div>
</div></section>

<section id="gallery"><div class="wrap">
  <h2>Your gallery</h2>
  <p style="color:var(--mut);margin-top:8px">Strips are kept on this device only.</p>
  <div id="grid"></div>
</div></section>

<footer><div class="wrap"><span data-c="footer">© CodeMeshFlow</span></div></footer>

<div id="modal"><div class="sheet">
  <h3>Your strip</h3>
  <img id="out" alt="Your photo strip">
  <div class="row">
    <button class="btn pri" id="b-save">Save to gallery</button>
    <button class="btn" id="b-pdf">Download PDF</button>
    <button class="btn" id="b-png">Download image</button>
  </div>
  <div class="row"><button class="btn" id="b-retake">Retake</button><button class="btn" id="b-close">Close</button></div>
</div></div>

<div id="toast" role="status"></div>

<script>
const CONFIG = {
  brand: "CodeMeshFlow PhotoBooth",
  headline: "Pick 1 to 4 frames.",
  tagline: "Pose, then save your photos to your gallery or as a PDF.",
  stripHeader: "CODEMESHFLOW BOOTH",
  stripFooter: "#codemeshflow • 2026",
  siteUrl: "codemeshflow.com"
};

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const S={layout:'3',time:3,filter:'none',color:'#000000',stk:[],shots:[],facing:'user',demo:false,busy:false};
const need=()=>+S.layout;
let stream=null,ac=null,lastBlob=null,lastSaved=false;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2800)}  function render(){   $$('[data-c]').forEach(e=>{const k=e.dataset.c;if(CONFIG[k]!==undefined)e.textContent=CONFIG[k]});
  document.title=CONFIG.brand;
}
render();

async function startCam(){
  stopCam();S.demo=false;$('#demo').hidden=true;$('#vid').hidden=false;
  if(!navigator.mediaDevices?.getUserMedia){return demoOn('Camera not supported here')}
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:S.facing},width:{ideal:1280},height:{ideal:960}}});
    const v=$('#vid');v.srcObject=stream;await v.play().catch(()=>{});
    v.classList.toggle('mirror',S.facing==='user');
    $('#status').textContent='Live camera';
  }catch(e){demoOn('Camera blocked: allow access in browser settings')}
}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function demoOn(msg){
  stopCam();S.demo=true;$('#vid').hidden=true;$('#demo').hidden=false;$('#status').textContent=msg||'Demo feed';
  const c=$('#demo'),x=c.getContext('2d');
  (function loop(){if(!S.demo)return;const g=x.createLinearGradient(0,0,800,600);g.addColorStop(0,'#2a0707');g.addColorStop(1,'#080606');x.fillStyle=g;x.fillRect(0,0,800,600);
    x.fillStyle='#ef4444';x.font='bold 34px Georgia';x.textAlign='center';x.fillText(CONFIG.brand,400,290);
    x.fillStyle='#9a8f8e';x.font='20px sans-serif';x.fillText('Demo feed',400,330);
    x.fillRect(0,(Date.now()/8)%600,800,2);requestAnimationFrame(loop)})();
}
$('#flip').onclick=()=>{S.facing=S.facing==='user'?'environment':'user';startCam()};
$('#demoBtn').onclick=()=>S.demo?startCam():demoOn('Demo feed');

function seg(id,fn){$$(id+' button').forEach(b=>b.onclick=()=>{if(b.dataset.clear!==undefined){fn(null);return}$$(id+' button').forEach(x=>x.classList.remove('on'));b.classList.add('on');fn(b.dataset.v||b.textContent)})}
seg('#s-layout',v=>{S.layout=v;S.shots=[];$('#count').textContent='Shot 0 of '+need()}); seg('#s-time',v=>S.time=+v); seg('#s-col',v=>S.color=v); $$('#s-stk button').forEach(b=>b.onclick=()=>{if(b.dataset.clear!==undefined)S.stk=[];else S.stk.push({e:b.textContent,x:15+Math.random()*70,y:15+Math.random()*70});drawStk()});
function drawStk(){const c=$('#stk');c.innerHTML='';S.stk.forEach((s,i)=>{const e=document.createElement('span');e.textContent=s.e;e.style.left=s.x+'%';e.style.top=s.y+'%';e.onclick=()=>{S.stk.splice(i,1);drawStk()};c.appendChild(e)})}
const FILT={none:'none',warm:'contrast(1.15) saturate(1.5) sepia(.25) hue-rotate(-15deg)',green:'contrast(1.15) saturate(1.4) hue-rotate(80deg)',gray:'grayscale(1) contrast(1.2)',sepia:'sepia(.85) contrast(1.05)'};
$('#filter').onchange=e=>{S.filter=e.target.value;$('#vid').style.filter=FILT[S.filter];$('#demo').style.filter=FILT[S.filter]};

function beep(f){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.25);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.25)}catch(e){}}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function countdown(n){const c=$('#cd');c.style.display='flex';for(let i=n;i>0;i--){c.textContent=i;beep(440);await sleep(1000)}c.style.display='none'}
const SW=960,SH=720;
function snap(){
  const src=S.demo?$('#demo'):$('#vid'),sw=src.videoWidth||src.width,sh=src.videoHeight||src.height;
  const c=document.createElement('canvas');c.width=SW;c.height=SH;const x=c.getContext('2d');
  let cw=sw,ch=sw*3/4;if(ch>sh){ch=sh;cw=sh*4/3}
  const cx=(sw-cw)/2,cy=(sh-ch)/2;
  const mirror=!S.demo&&S.facing==='user';
  x.save();if(mirror){x.translate(SW,0);x.scale(-1,1)}
  if('filter' in x)x.filter=FILT[S.filter]==='none'?'none':FILT[S.filter];
  x.drawImage(src,cx,cy,cw,ch,0,0,SW,SH);x.restore();x.filter='none';
  if(!('filter' in x))manualFilter(x);
  x.font='64px sans-serif';x.textAlign='center';x.textBaseline='middle';
  S.stk.forEach(s=>x.fillText(s.e,s.x/100*SW,s.y/100*SH));
  const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');beep(880);
  S.shots.push(c);
}
function manualFilter(x){
  if(S.filter==='none')return;const d=x.getImageData(0,0,SW,SH),p=d.data;
  for(let i=0;i<p.length;i+=4){const r=p[i],g=p[i+1],b=p[i+2];
    if(S.filter==='gray'){p[i]=p[i+1]=p[i+2]=.3*r+.59*g+.11*b}
    else if(S.filter==='sepia'){p[i]=Math.min(255,.393*r+.769*g+.189*b);p[i+1]=Math.min(255,.349*r+.686*g+.168*b);p[i+2]=Math.min(255,.272*r+.534*g+.131*b)}
    else if(S.filter==='warm'){p[i]=Math.min(255,r*1.2+20);p[i+2]=b*.85}
    else if(S.filter==='green'){p[i]=r*.7;p[i+1]=Math.min(255,g*1.2+15)}}
  x.putImageData(d,0,0);
}
$('#shoot').onclick=async()=>{
  if(S.busy)return;S.busy=true;$('#shoot').disabled=true;S.shots=[];beep(1);
  try{
    for(let i=0;i<need();i++){$('#count').textContent=`Shot ${i+1} of ${need()}`;await countdown(S.time);snap();await sleep(500)}
    await compose();openModal();
  }catch(e){console.error(e);toast('Something went wrong. Please try again.')}
  S.busy=false;$('#shoot').disabled=false;
};

async function compose(){
  const P=56,G=40,H=170,F=150,n=need(),two=n===4;
  const rows=two?2:n,W=two?SW*2+P*2+G:SW+P*2, Ht=H+SH*rows+G*(rows-1)+P+F;
  const c=document.createElement('canvas');c.width=W;c.height=Ht;const x=c.getContext('2d');
  const dark=S.color==='#ffffff';
  x.fillStyle=S.color;x.fillRect(0,0,W,Ht);
  x.textAlign='center';x.textBaseline='alphabetic';
  x.fillStyle='#ef4444';x.font='bold 54px Georgia,serif';x.fillText(CONFIG.stripHeader,W/2,H-66);
  x.fillStyle=dark?'#999':'#666';x.fillRect(W/2-60,H-40,120,3);
  S.shots.forEach((s,i)=>{
    const col=two?i%2:0,row=two?Math.floor(i/2):i;
    const px=P+col*(SW+G),py=H+row*(SH+G);
    x.fillStyle=dark?'#ddd':'#222';x.fillRect(px-6,py-6,SW+12,SH+12);
    x.drawImage(s,px,py);
  });
  x.fillStyle=dark?'#555':'#aaa';x.font='34px Georgia,serif';x.fillText(CONFIG.stripFooter,W/2,Ht-F+62);
  x.fillStyle='#ef4444';x.font='bold 26px sans-serif';x.fillText(CONFIG.siteUrl,W/2,Ht-F+110);
  lastBlob=await new Promise(r=>c.toBlob(r,'image/jpeg',.92));
  lastSaved=false;
  lastBlob.w=W;lastBlob.h=Ht;
}

let outUrl=null;
function openModal(){if(outUrl)URL.revokeObjectURL(outUrl);outUrl=URL.createObjectURL(lastBlob);$('#out').src=outUrl;$('#modal').classList.add('open');document.body.style.overflow='hidden'}
function closeModal(){$('#modal').classList.remove('open');document.body.style.overflow=''}
$('#b-close').onclick=closeModal;
$('#b-retake').onclick=()=>{closeModal();S.shots=[];$('#count').textContent='Shot 0 of '+need();document.getElementById('booth').scrollIntoView()};

function saveAs(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
const stamp=()=>'codemeshflow-'+Date.now();

async function toGallery(blob,name){
  const f=new File([blob],name+'.jpg',{type:'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f],title:CONFIG.brand});return 'shared'}catch(e){if(e.name==='AbortError')return 'cancel'}
  }
  saveAs(blob,name+'.jpg');return 'download';
}
$('#b-save').onclick=async()=>{
  if(!lastSaved){await dbPut(lastBlob);lastSaved=true;loadGallery()}
  const r=await toGallery(lastBlob,stamp());
  if(r==='shared')toast('Choose "Save Image" to add it to your photos');
  else if(r==='download')toast('Saved to your downloads. Find it in your gallery or Files app');
};
$('#b-png').onclick=()=>{saveAs(lastBlob,stamp()+'.jpg');toast('Image downloaded')};
$('#b-pdf').onclick=()=>makePdf(lastBlob).then(b=>{saveAs(b,stamp()+'.pdf');toast('PDF downloaded')});

async function makePdf(blob){
  const jpg=new Uint8Array(await blob.arrayBuffer());
  const iw=blob.w,ih=blob.h;
  const A4w=595,A4h=842,m=28;
  const sc=Math.min((A4w-m*2)/iw,(A4h-m*2)/ih),w=iw*sc,h=ih*sc,x0=(A4w-w)/2,y0=(A4h-h)/2;
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const add=d=>{const b=typeof d==='string'?enc.encode(d):d;parts.push(b);len+=b.length};
  add('%PDF-1.4\n');
  const obj=(n,body)=>{offs[n]=len;add(n+' 0 obj\n'+body+'\nendobj\n')};
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${A4w} ${A4h}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  offs[4]=len;add(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);add(jpg);add('\nendstream\nendobj\n');
  const cs=`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x0.toFixed(2)} ${y0.toFixed(2)} cm /Im0 Do Q`;
  obj(5,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
  const xr=len;let t='xref\n0 6\n0000000000 65535 f \n';
  for(let i=1;i<=5;i++)t+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  add(t+`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}

let db;
const dbOpen=()=>new Promise(r=>{try{const q=indexedDB.open('cmf-booth',1);q.onupgradeneeded=()=>q.result.createObjectStore('s',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function dbPut(b){db=db||await dbOpen();if(!db)return;const buf=await b.arrayBuffer();return new Promise(r=>{const t=db.transaction('s','readwrite');t.objectStore('s').put({id:Date.now(),buf,w:b.w,h:b.h});t.oncomplete=r;t.onerror=r})}
async function dbAll(){db=db||await dbOpen();if(!db)return[];return new Promise(r=>{const q=db.transaction('s').objectStore('s').getAll();q.onsuccess=()=>r(q.result.sort((a,b)=>b.id-a.id));q.onerror=()=>r([])})}
async function dbDel(id){db=db||await dbOpen();if(!db)return;return new Promise(r=>{const t=db.transaction('s','readwrite');t.objectStore('s').delete(id);t.oncomplete=r})}
async function loadGallery(){
  const g=$('#grid'),items=await dbAll();g.innerHTML='';
  if(!items.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">No strips yet. Take photos, then tap Save to gallery.</div>';return}
  items.forEach(it=>{
    const blob=new Blob([it.buf],{type:'image/jpeg'});blob.w=it.w;blob.h=it.h;const u=URL.createObjectURL(blob);
    const d=document.createElement('div');d.className='card';
    d.innerHTML=`<img src="${u}" alt="Saved strip" loading="lazy"><div class="row"><button class="btn" data-a="s">Save</button><button class="btn" data-a="p">PDF</button><button class="btn" data-a="d">Delete</button></div>`;
    d.querySelector('[data-a=s]').onclick=()=>toGallery(blob,'codemeshflow-'+it.id);
    d.querySelector('[data-a=p]').onclick=()=>makePdf(blob).then(b=>saveAs(b,'codemeshflow-'+it.id+'.pdf'));
    d.querySelector('[data-a=d]').onclick=async()=>{await dbDel(it.id);loadGallery()};
    g.appendChild(d);
  });
}

$('#count').textContent='Shot 0 of '+need();
loadGallery();startCam();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!S.demo&&(!stream||!stream.active))startCam()});
</script>
</body>
</html>
